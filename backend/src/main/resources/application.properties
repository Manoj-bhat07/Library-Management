# ============================================================
# Library Management System - Spring Boot configuration
# ============================================================

server.port=8080

# ---------- MySQL connection ----------
# Database: library_db
# Default user/password: root / root
# If your MySQL password is different, change DB_PASSWORD below
# (or set the DB_PASSWORD environment variable).
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Manojbhat@2407}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" automatically creates/updates the books table on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Error messages ----------
server.error.include-message=always
